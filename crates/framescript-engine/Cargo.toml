[package]
name = "framescript-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anti-webui-core.workspace = true
anti-webui-style.workspace = true
anti-webui-wgpu.workspace = true
anti-webui-video.workspace = true
deno_core.workspace = true
deno_ast.workspace = true
serde_json.workspace = true
tokio.workspace = true
serde.workspace = true
deno_error.workspace = true
png.workspace = true
bytemuck.workspace = true
# WGSL that compositions write is parsed and validated, and its uniforms read, with naga.
naga = { version = "30", features = ["wgsl-in"] }
glam = { version = "0.33", features = ["bytemuck"] }
# glTF models: the documents, their buffers and their pictures.
gltf = { version = "1", default-features = false, features = ["import", "utils", "names", "KHR_materials_emissive_strength"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
